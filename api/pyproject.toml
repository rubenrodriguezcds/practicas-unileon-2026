# Configuración de ruff, el linter de la API: `ruff check .` (ver requirements-dev.txt).
[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W estilo, F errores (imports sin usar, nombres indefinidos), I orden de imports,
# B errores típicos, UP sintaxis moderna de Python.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) como valor por defecto es la forma idiomática de FastAPI, no un error.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# conftest pone variables de entorno ANTES de importar la app (que las lee al importarse).
"tests/conftest.py" = ["E402"]
