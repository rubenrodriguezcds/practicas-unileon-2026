services:
  db:
    build: ./db
    env_file: .env
    ports:
      - "1521:5432"   # 1521 lo exige el enunciado; dentro Postgres sigue en su 5432
      - "22:22"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP y no por socket: durante el init el servidor temporal solo escucha en socket,
      # así no se da por sano antes de que existan las tablas.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      # La web habla con la bbdd por la red interna de compose: nombre del servicio y puerto de dentro
      DB_HOST: db
      DB_PORT: "5432"
      # Buscador del asistente: Ollama por el túnel SSH abierto en el ordenador (ver indexador).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

  # Docling: lee los documentos (texto, títulos, tablas, OCR) y los trocea para el asistente.
  # Sin puertos publicados: solo lo usa el indexador por la red interna.
  docling:
    # Versión fijada: el indexador está probado contra la respuesta de esta versión.
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: "900" # documentos con OCR tardan más que los 120 s por defecto
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5001/health"]
      interval: 10s
      retries: 30
    # Un documento muy pesado puede tumbarlo por memoria: Docker lo levanta solo (~1 min), dentro
    # de lo que esperan los reintentos del indexador (1 y 2 min), así el documento no llega a «error».
    restart: unless-stopped

  # Indexador: en segundo plano convierte, trocea y vectoriza los documentos subidos y los guarda
  # en Postgres (ver indexador/README.md). Sin puertos publicados.
  indexador:
    build: ./indexador
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DOCLING_URL: http://docling:5001
      # Ollama (embeddings con bge-m3) está en el servidor; en desarrollo se llega por un túnel SSH
      # abierto en el ordenador (ver README). host.docker.internal = el ordenador, visto desde Docker.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # en Linux no existe por defecto (en Mac/Windows sí)
    depends_on:
      db:
        condition: service_healthy
      docling:
        condition: service_healthy
    restart: unless-stopped

  # Scripts de la prueba (Python + LibreOffice). Con perfil para que `up` no lo arranque:
  # se usa con `docker compose run --rm prueba python <script>.py`.
  prueba:
    build: ./prueba_docling
    profiles: ["prueba"]
    working_dir: /trabajo
    volumes:
      - ./prueba_docling:/trabajo
    environment:
      DOCLING_URL: http://docling:5001
    depends_on:
      docling:
        condition: service_healthy

volumes:
  pgdata:
